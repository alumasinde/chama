name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: chama
          POSTGRES_PASSWORD: chama
          POSTGRES_DB: chama
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chama -d chama"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://chama:chama@localhost:5432/chama?sslmode=disable
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: backend/go.sum
      - uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: "1.30.0"
      - name: Size guard
        run: ../scripts/check-size.sh
      - name: Brand codegen
        run: go run ./cmd/brandgen
      - name: sqlc is up to date
        run: sqlc diff
      - name: Download modules
        run: go mod download
      - name: Vet
        run: go vet ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: backend
      - name: Test with race detector
        run: go test -race ./...
      - name: Migrate up, down, up
        run: |
          go run ./cmd/migrate up
          go run ./cmd/migrate down 3
          go run ./cmd/migrate up
