version: "2"

run:
  timeout: 5m
  tests: true

linters:
  enable:
    - bodyclose
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unconvert
    - unused
    - gosec
    - revive
    - misspell
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
    gosec:
      excludes:
        - G404
  exclusions:
    paths:
      - backend/internal/store

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
