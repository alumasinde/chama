version: "2"
sql:
  - schema:
      - migrations/0001_lookups.up.sql
      - migrations/0002_lookups_extended.up.sql
      - migrations/0003_users_auth.up.sql
      - migrations/0004_groups_members.up.sql
      - migrations/0005_payment_settings.up.sql
      - migrations/0006_ledger.up.sql
      - migrations/0008_loans.up.sql
      - migrations/0009_fines.up.sql
      - migrations/0010_welfare.up.sql
      - migrations/0011_rotation.up.sql
      - migrations/0012_notifications.up.sql
    queries: queries
    engine: postgresql
    gen:
      go:
        package: store
        out: internal/store
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        emit_prepared_queries: false
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: timestamptz
            go_type:
              import: time
              type: Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
