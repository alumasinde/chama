  /api/v1/groups/{groupId}/loans/{loanId}/guarantors/respond:
    parameters:
      - name: groupId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: loanId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [loans]
      summary: Accept or decline a guarantor request
      description: >
        The caller must be an invited guarantor on a pending_guarantors loan. When every
        guarantor has responded the loan moves to pending_approval if enough accepted, or is
        rejected automatically.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [accepted, declined] }
      responses:
        "200":
          description: Decision recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Loan" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/groups/{groupId}/loans/{loanId}/decision:
    parameters:
      - name: groupId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: loanId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [loans]
      summary: Committee approves or rejects a loan (admin or treasurer)
      description: >
        Rejected while any guarantor is still pending, and when accepted guarantees are below
        the policy count. Approval writes the immutable schedule; rejection closes the loan.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approved, rejected] }
                comment: { type: [string, "null"] }
      responses:
        "200":
          description: Decision recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Loan" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/BusinessRule" }

