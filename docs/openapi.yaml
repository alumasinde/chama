      responses:
        "200":
          description: Loan active
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Loan" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/groups/{groupId}/loans/{loanId}/repayments:
    parameters:
      - name: groupId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: loanId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [loans]
      summary: Record a manual repayment (treasurer, step-up)
      description: >
