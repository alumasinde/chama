openapi: 3.1.0
info:
  title: Chama Ledger API
  version: 0.1.0
  description: >
    Implemented surface: identity and sessions (Phase 1), chamas, memberships, invites and
    M-Pesa payment settings (Phase 2), and STK push, signed callbacks, idempotent settlement
    and receipts (Phase 3). Amounts are strings with two decimals; timestamps are ISO-8601 UTC.
servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: meta
  - name: auth
  - name: profile
  - name: groups
  - name: payments

paths:
  /api/v1/meta:
    get:
      tags: [meta]
      summary: Runtime branding and capabilities
      responses:
        "200":
          description: Brand values, so clients never hard-code the product name
          content:
            application/json:
              schema:
                type: object
                properties:
                  app_name: { type: string }
                  short_name: { type: string }
                  currency: { type: string, example: KES }
                  primary_color: { type: string }
                  accent_color: { type: string }
                  support_email: { type: string }
                  features: { type: array, items: { type: string } }
                  api_version: { type: string }
                  server_time: { type: string, format: date-time }

  /healthz:
    get:
      tags: [meta]
      summary: Liveness probe
      responses:
        "200": { description: Process is up }

  /readyz:
    get:
      tags: [meta]
      summary: Readiness probe (database ping)
      responses:
        "200": { description: Ready }
        "503": { description: Database unreachable }

  /api/v1/auth/otp/request:
    post:
      tags: [auth]
      summary: Send a 6-digit OTP
      description: Rate limited to 3 per phone per 10 minutes and 10 per IP per hour.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone_number, purpose]
              properties:
                phone_number: { type: string, example: "0712345678" }
                purpose:
                  type: string
                  enum: [login, registration, pin_reset]
      responses:
        "200":
          description: Code sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  expires_in: { type: integer, example: 600 }
                  resend_after: { type: integer, example: 60 }
                  dev_code:
                    type: string
                    description: Development only; never present in production.
        "400": { $ref: "#/components/responses/Validation" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/auth/otp/verify:
    post:
      tags: [auth]
      summary: Verify an OTP
      description: >
        Returns a session for an existing member, or a short-lived registration token
        when the phone has no account yet.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone_number, code, purpose]
              properties:
                phone_number: { type: string }
                code: { type: string, example: "482913" }
                purpose: { type: string, enum: [login, registration] }
      responses:
        "200":
          description: Verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  new_user: { type: boolean }
                  registration_token: { type: string }
                  expires_in: { type: integer }
                  session: { $ref: "#/components/schemas/Session" }
        "422": { $ref: "#/components/responses/BusinessRule" }

  /api/v1/auth/register:
    post:
      tags: [auth]
      summary: Create the account after OTP verification
      description: Requires the registration token as a Bearer token. PIN is exactly 4 digits.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [first_name, last_name, pin]
              properties:
                first_name: { type: string, maxLength: 80 }
                last_name: { type: string, maxLength: 80 }
                pin:
                  type: string
                  pattern: "^[0-9]{4}$"
                  description: Rejected if repeated, sequential or in the weak-PIN list.
                email: { type: string, format: email }
                national_id: { type: string, description: Encrypted at rest; never returned. }
                password:
                  type: string
                  minLength: 8
                  description: Optional alternative login for the web dashboard.
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/Validation" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Password login
      description: Requires a password set on the account; OTP login is the default.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone_number, password]
              properties:
                phone_number: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/auth/token/refresh:
    post:
      tags: [auth]
      summary: Rotate the refresh token
      description: >
        Each refresh returns a new token. Reusing a rotated token revokes the whole
        session family.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: New token pair
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: Revoke the current session family
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Logged out }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/auth/pin/verify:
    post:
      tags: [auth]
      summary: Mint a 5-minute step-up token
      description: Required as X-Step-Up-Token on every money-moving request.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pin]
              properties:
                pin: { type: string, pattern: "^[0-9]{4}$" }
      responses:
        "200":
          description: Step-up granted
          content:
            application/json:
              schema:
                type: object
                properties:
                  step_up_token: { type: string }
                  expires_in: { type: integer, example: 300 }
        "422":
          description: pin_incorrect, pin_locked or pin_not_set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/auth/pin/reset:
    post:
      tags: [auth]
      summary: Reset the PIN with an OTP
      description: Also revokes every refresh token for the account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone_number, code, new_pin]
              properties:
                phone_number: { type: string }
                code: { type: string }
                new_pin: { type: string, pattern: "^[0-9]{4}$" }
      responses:
        "204": { description: PIN reset }
        "422": { $ref: "#/components/responses/BusinessRule" }

  /api/v1/me:
    get:
      tags: [profile]
      summary: Current profile
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Caller profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [profile]
      summary: Update names, email or national ID
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [first_name, last_name]
              properties:
                first_name: { type: string }
                last_name: { type: string }
                email: { type: string, format: email }
                national_id: { type: string }
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Validation" }

  /api/v1/me/pin:
    post:
      tags: [profile]
      summary: Change PIN
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_pin, new_pin]
              properties:
                current_pin: { type: string }
                new_pin: { type: string }
      responses:
        "204": { description: PIN changed }
        "422": { $ref: "#/components/responses/BusinessRule" }

  /api/v1/me/password:
    post:
      tags: [profile]
      summary: Set or change the password (PIN-gated)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pin, password]
              properties:
                pin: { type: string }
                password: { type: string, minLength: 8 }
      responses:
        "204": { description: Password stored }
        "422": { $ref: "#/components/responses/BusinessRule" }

  /api/v1/me/devices:
    get:
      tags: [profile]
      summary: List registered devices
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Devices
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Device" }
    post:
      tags: [profile]
      summary: Register a device for push and biometric unlock
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform]
              properties:
                platform: { type: string, enum: [android, ios, web] }
                device_token: { type: string }
                device_name: { type: string }
                biometric_enabled: { type: boolean }
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }

  /api/v1/me/devices/{deviceID}:
    delete:
      tags: [profile]
      summary: Revoke a device
      security: [{ bearerAuth: [] }]
      parameters:
        - name: deviceID
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Revoked }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/groups:
    get:
      tags: [groups]
      summary: Chamas the caller belongs to
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Active and pending memberships
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Group" }
    post:
      tags: [groups]
      summary: Create a chama (creator becomes admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, contribution_amount, contribution_frequency]
              properties:
                name: { type: string, maxLength: 120 }
                description: { type: [string, "null"] }
                contribution_amount: { type: string, example: "1500.00" }
                contribution_frequency:
                  type: string
                  enum: [weekly, biweekly, monthly]
                contribution_day: { type: integer, minimum: 1, maximum: 31 }
                late_grace_days: { type: integer, minimum: 0, maximum: 30 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "400": { $ref: "#/components/responses/Validation" }

  /api/v1/groups/join:
    post:
      tags: [groups]
      summary: Join with an 8-character invite code
      description: Creates a pending membership; admins approve before data is visible.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invite_code]
              properties:
                invite_code: { type: string, example: "Y27MEN2H" }
      responses:
        "200":
          description: Joined or already a member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JoinResult" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/groups/{groupId}:
    parameters:
      - name: groupId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [groups]
      summary: Chama detail for a member
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Chama with the caller's role
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [groups]
      summary: Update the chama profile (admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: [string, "null"] }
                contribution_amount: { type: string }
                contribution_frequency: { type: string }
                contribution_day: { type: integer }
                late_grace_days: { type: integer }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/groups/{groupId}/members:
    parameters:
      - name: groupId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [groups]
      summary: Members with roles and approval status
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Active members first, pending last
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Member" }
        "403":
          description: membership_pending for unapproved members
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/groups/{groupId}/members/{userID}:
    parameters:
      - name: groupId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: userID
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [groups]
      summary: Approve, suspend or promote a member (admin)
      description: The last active admin cannot be demoted or removed.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { type: string, enum: [admin, treasurer, secretary, member] }
                status: { type: string, enum: [active, pending, suspended, exited] }
      responses:
        "200":
          description: Updated membership
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: last_admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/groups/{groupId}/invites/rotate:
    parameters:
      - name: groupId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [groups]
      summary: Rotate the invite code (admin)
      description: The previous code stops working immediately.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: New code
          content:
            application/json:
              schema:
                type: object
                properties:
                  invite_code: { type: string, example: "Y27MEN2H" }

  /api/v1/groups/{groupId}/payment-settings:
    parameters:
      - name: groupId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [groups, payments]
      summary: Read the chama's own M-Pesa settings (admin/treasurer)
      description: Secrets are always masked; the callback URL is never re-shown.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Masked settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentSettings" }
    put:
      tags: [groups, payments]
      summary: Save the chama's own M-Pesa shortcode credentials (admin/treasurer)
      description: >
        Secrets are encrypted with AES-256-GCM before storage. Omitting a secret keeps the
        stored value, so the form can be saved without re-entering keys.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shortcode_type, shortcode, daraja_environment]
              properties:
                shortcode_type: { type: string, enum: [paybill, till] }
                shortcode: { type: string, example: "247247" }
                account_reference_template: { type: string, example: "CHAMA-{member_short}" }
                daraja_environment: { type: string, enum: [sandbox, production] }
                consumer_key: { type: string, description: Write-only. }
                consumer_secret: { type: string, description: Write-only. }
                passkey: { type: string, description: Write-only. }
      responses:
        "200":
          description: Saved; callback_url is returned only on this save
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentSettings" }
        "400": { $ref: "#/components/responses/Validation" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/groups/{groupId}/payments/stk:
    parameters:
      - name: groupId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: Idempotency-Key
        in: header
        required: true
        schema: { type: string, minLength: 8, maxLength: 128 }
        description: Replaying the same key and body returns the original 202 response.
      - name: X-Step-Up-Token
        in: header
        required: true
        schema: { type: string }
        description: Minted by POST /auth/pin/verify; audience step_up, 5 minutes.
    post:
      tags: [payments]
      summary: Prompt the member's phone with an M-Pesa STK push
      description: >
        The money moves on the chama's own shortcode; the platform only records it.
        Amounts must be whole shillings because M-Pesa rejects decimals.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, purpose]
              properties:
                amount: { type: string, example: "1500.00" }
                purpose:
                  type: string
                  enum: [contribution, fine, loan_repayment, welfare_contribution]
                phone_number:
                  type: string
                  description: Defaults to the caller's verified phone.
      responses:
        "202":
          description: STK accepted and a pending ledger row created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/STKResult" }
        "400": { $ref: "#/components/responses/Validation" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: idempotency_conflict or request_in_progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "422":
          description: amount_not_whole_shillings or payment_settings_missing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "502":
          description: provider_error from Daraja
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/groups/{groupId}/transactions:
    parameters:
      - name: groupId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: limit
        in: query
        schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      - name: cursor
        in: query
        schema: { type: string }
    get:
      tags: [payments]
      summary: Ledger entries, newest first
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Page of transactions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Transaction" }
                  page:
                    type: object
                    properties:
                      next_cursor: { type: [string, "null"] }
                      has_more: { type: boolean }

  /api/v1/groups/{groupId}/transactions/{txID}:
    parameters:
      - name: groupId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: txID
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [payments]
      summary: Receipt detail for one ledger entry
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Transaction with M-Pesa receipt number when settled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transaction" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/payments/mpesa/callback/{groupID}/{secret}:
    parameters:
      - name: groupID
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: secret
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [payments]
      summary: Daraja STK callback
      description: >
        Authenticated by the unguessable per-group path secret compared in constant time.
        Always answers 200 after persisting, including unknown checkout IDs; a wrong secret
        answers 403 with an empty body. Duplicate callbacks settle at most once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                Body:
                  type: object
                  properties:
                    stkCallback:
                      type: object
                      properties:
                        MerchantRequestID: { type: string }
                        CheckoutRequestID: { type: string }
                        ResultCode: { type: integer }
                        ResultDesc: { type: string }
                        CallbackMetadata:
                          type: object
                          properties:
                            Item:
                              type: array
                              items:
                                type: object
                                properties:
                                  Name: { type: string }
                                  Value: {}
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ResultCode: { type: integer, example: 0 }
                  ResultDesc: { type: string, example: Accepted }
        "403": { description: Wrong group or secret; empty body }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        phone_number: { type: string }
        first_name: { type: string }
        last_name: { type: string }
        display_name: { type: string }
        email: { type: [string, "null"] }
        is_active: { type: boolean }
        pin_set: { type: boolean }
        has_password: { type: boolean }
        national_id_set: { type: boolean }
        phone_verified: { type: boolean }
        created_at: { type: string, format: date-time }

    Session:
      type: object
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string, example: Bearer }
        expires_in: { type: integer, example: 900 }
        refresh_expires_in: { type: integer, example: 2592000 }
        user: { $ref: "#/components/schemas/User" }

    Device:
      type: object
      properties:
        id: { type: string, format: uuid }
        platform: { type: string }
        device_name: { type: [string, "null"] }
        biometric_enabled: { type: boolean }
        last_seen_at: { type: string, format: date-time }

    Group:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, "null"] }
        invite_code: { type: string }
        currency: { type: string, example: KES }
        contribution_amount: { type: string, example: "1500.00" }
        contribution_frequency: { type: string, enum: [weekly, biweekly, monthly] }
        contribution_day: { type: integer }
        late_grace_days: { type: integer }
        role: { type: string, enum: [admin, treasurer, secretary, member] }
        status: { type: string, enum: [active, pending, suspended, exited] }
        active_members: { type: integer }
        created_at: { type: string, format: date-time }

    Member:
      type: object
      properties:
        user_id: { type: string, format: uuid }
        first_name: { type: string }
        last_name: { type: string }
        display_name: { type: string }
        role: { type: string }
        status: { type: string }
        joined_at: { type: [string, "null"], format: date-time }

    JoinResult:
      type: object
      properties:
        group_id: { type: string, format: uuid }
        group_name: { type: string }
        status: { type: string, example: pending }
        message: { type: string }

    PaymentSettings:
      type: object
      properties:
        configured: { type: boolean }
        shortcode_type: { type: string, enum: [paybill, till] }
        shortcode: { type: string }
        account_reference_template: { type: string }
        daraja_environment: { type: string, enum: [sandbox, production] }
        consumer_key_masked: { type: string, example: "••••7890" }
        consumer_secret_masked: { type: string, example: "••••7890" }
        passkey_masked: { type: string, example: "••••7890" }
        is_verified: { type: boolean }
        verified_at: { type: [string, "null"], format: date-time }
        updated_at: { type: [string, "null"], format: date-time }
        callback_url:
          type: string
          description: Present only in the PUT response that saved the settings.

    STKResult:
      type: object
      properties:
        payment_request_id: { type: string, format: uuid }
        checkout_request_id: { type: string, example: "ws_CO_19112026121234567" }
        status: { type: string, example: pending }
        amount: { type: string, example: "1500.00" }
        purpose: { type: string }

    Transaction:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        member: { type: string }
        type: { type: string, example: contribution }
        status: { type: string, enum: [pending, completed, failed, reversed] }
        channel: { type: [string, "null"], example: mpesa_stk }
        amount: { type: string, example: "1500.00" }
        reference_code: { type: [string, "null"], example: QK12345678 }
        narration: { type: string }
        period_label: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        completed_at: { type: [string, "null"], format: date-time }

    ErrorEnvelope:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, example: pin_locked }
            message: { type: string }
            fields:
              type: object
              additionalProperties: { type: string }

  responses:
    Validation:
      description: Invalid input
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Unauthorized:
      description: Missing, expired or invalid token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Conflict:
      description: Conflicting state, e.g. phone already registered
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    BusinessRule:
      description: Business rule rejected the request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Forbidden:
      description: Missing permission, inactive membership or required step-up
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    RateLimited:
      description: Too many attempts
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
